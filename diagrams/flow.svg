<svg viewBox="0 0 1200 744" role="img" aria-label="The whole system: meetings, email, calendar, clippings, phone capture and notes flow into one vault of plain markdown; agents read and write the same files; briefs, drafts and a dashboard flow out to you; your decisions go back in." xmlns="http://www.w3.org/2000/svg">
