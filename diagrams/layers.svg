<text x="644.0" y="616.0" class="h" text-anchor="start" >The vault</text>
<text x="644.0" y="638.0" class="s" text-anchor="start" style="font-size:13.5px">Plain markdown in one folder: projects, people, meetings,</text>
<text x="644.0" y="657.0" class="s" text-anchor="start" style="font-size:13.5px">notes. Every tool reads and writes the same files.</text>
<polygon points="100,512 330,586 330,610 100,536" fill="#e9eeeb" stroke="#c3cdc6"/><polygon points="330,586 560,512 560,536 330,610" fill="#dfe6e1" stroke="#c3cdc6"/><polygon points="330,438 560,512 330,586 100,512" fill="#ffffff" stroke="#c3cdc6"/>
