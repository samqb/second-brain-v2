<text x="644.0" y="500.0" class="h" text-anchor="start" >Five root logs</text>
<text x="644.0" y="522.0" class="s" text-anchor="start" style="font-size:13.5px">Tasks, activity, decisions, goals, questions.</text>
<text x="644.0" y="541.0" class="s" text-anchor="start" style="font-size:13.5px">How each agent sees what the others did.</text>
<polygon points="100,396 330,470 330,494 100,420" fill="#f0e2b6" stroke="#e0af68"/><polygon points="330,470 560,396 560,420 330,494" fill="#e9d69f" stroke="#e0af68"/><polygon points="330,322 560,396 330,470 100,396" fill="#fbf3df" stroke="#e0af68"/>
<polygon points="330.0,342.7 495.6,396.0 330.0,449.3 164.4,396.0" fill="none" stroke="#e0af68" stroke-dasharray="7 5" stroke-width="2"/>
<circle cx="560" cy="396" r="4" fill="#0a0a0a"/><line x1="560" y1="396" x2="628" y2="396" stroke="#0a0a0a" stroke-width="1.2"/>
<text x="644.0" y="384.0" class="h" text-anchor="start" >The rules</text>
<text x="644.0" y="406.0" class="s" text-anchor="start" style="font-size:13.5px">A delegation policy: agents draft, you decide.</text>
<text x="644.0" y="425.0" class="s" text-anchor="start" style="font-size:13.5px">Staging first, never delete, hard brakes on every goal.</text>
<polygon points="100,280 330,354 330,378 100,304" fill="#e9eeeb" stroke="#c3cdc6"/><polygon points="330,354 560,280 560,304 330,378" fill="#dde5df" stroke="#c3cdc6"/><polygon points="330,206 560,280 330,354 100,280" fill="#f3f6f4" stroke="#c3cdc6"/>
