<text x="644.0" y="268.0" class="h" text-anchor="start" >The agents</text>
<text x="644.0" y="290.0" class="s" text-anchor="start" style="font-size:13.5px">Scheduled tasks overnight, a desktop agent and a coding</text>
<text x="644.0" y="309.0" class="s" text-anchor="start" style="font-size:13.5px">agent by day, remote sessions, a voice agent for the briefs.</text>
<polygon points="100,164 330,238 330,262 100,188" fill="#c8f5de" stroke="#c3cdc6"/><polygon points="330,238 560,164 560,188 330,262" fill="#e8faf1" stroke="#c3cdc6"/><polygon points="330,90 560,164 330,238 100,164" fill="#ffffff" stroke="#c3cdc6"/>
