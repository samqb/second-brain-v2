<polygon points="343.8,153.6 389.8,168.4 343.8,183.2 297.8,168.4" fill="#ffffff" stroke="#c3cdc6" />
<circle cx="560" cy="164" r="4" fill="#0a0a0a"/><line x1="560" y1="164" x2="628" y2="164" stroke="#0a0a0a" stroke-width="1.2"/>
<text x="644.0" y="152.0" class="h" text-anchor="start" >What you see</text>
<text x="644.0" y="174.0" class="s" text-anchor="start" style="font-size:13.5px">One dashboard as your home page, and the briefs</text>
<text x="644.0" y="193.0" class="s" text-anchor="start" style="font-size:13.5px">the agents wrote before you woke up.</text>
<line x1="330" y1="74" x2="330" y2="88" stroke="#0a0a0a" stroke-width="1.2"/>
